version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pulsecast-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - GIN_MODE=release
      - DB_NAME=pulsecast
      - MONGODB_URI=${MONGODB_URI}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET=${JWT_SECRET:-pulsecast_super_secret_jwt_key_2026}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_BACKEND_URL=${VITE_BACKEND_URL:-http://localhost:8080}
        - VITE_API_URL=${VITE_API_URL:-http://localhost:8080/api}
        - VITE_WS_URL=${VITE_WS_URL:-ws://localhost:8080/api/ws}
    container_name: pulsecast-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
