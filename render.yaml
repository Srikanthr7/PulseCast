services:
  # ============================================================================
  # 1. PulseCast Go Backend Service (Gin + WebSockets + MongoDB + Redis)
  # ============================================================================
  - type: web
    name: pulsecast-backend
    runtime: go
    rootDir: backend
    buildCommand: go build -o server .
    startCommand: ./server
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8080
      - key: GIN_MODE
        value: release
      - key: DB_NAME
        value: pulsecast
      - key: MONGODB_URI
        sync: false # Set via Render Dashboard: mongodb+srv://...
      - key: REDIS_URL
        sync: false # Set via Render Dashboard: rediss://...
      - key: JWT_SECRET
        generateValue: true

  # ============================================================================
  # 2. PulseCast React Frontend (Vite Static Site)
  # ============================================================================
  - type: web
    name: pulsecast-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: pulsecast-backend
          property: host
      - key: VITE_WS_URL
        fromService:
          type: web
          name: pulsecast-backend
          property: host
